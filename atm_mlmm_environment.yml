name: atm-mlmm-p0

# Project 0 baseline environment.
#
# This file deliberately keeps the top-level dependency set small and uses
# Conda for the scientific/molecular-simulation stack. Packages that are not
# available in the required pinned form on the selected Conda channels are
# installed through the pip section below.
#
# This is a reproducible *environment specification*, not a platform lock.
# After the first successful qualification, export/freeze the resolved package
# build set and record the model/checkpoint hash as described in ATM_MLMM_Environment.md.

channels:
  - conda-forge
  - nodefaults

# The first qualification target is Python 3.11 on Linux x86_64.
# This environment file intentionally does not use a nonstandard `platforms`
# key; platform targeting is handled by the Conda solver / lock step.

dependencies:
  - python=3.11
  - pip>=25,<27
  - git
  - setuptools
  - wheel

  # Molecular simulation core.
  - openmm=8.6.1

  # System preparation / force-field support used by the AToM workflow.
  - ambertools=26.0
  - openmmforcefields=0.16.0
  - configobj=5.0.9
  - setproctitle

  # Numerical / scientific Python stack.
  # G00 dependency consistency amendment: AmberTools bundled Python tools.
  - numpy>=1.26,<2
  - biopython>=1.83,<1.86
  - netcdf4
  - pdb2pqr
  - requests
  - docutils<0.18
  - scipy
  - pyyaml
  - packaging
  - psutil

  # MACE 0.3.16 is a qualification candidate using the older e3nn interface in the
  # selected OpenMM-ML/MACE integration path. Keep this explicit rather than
  # allowing the solver to upgrade it silently.
  - e3nn=0.4.4

  # Independent free-energy estimator and trajectory utilities.
  - pymbar=4.0.3
  - mdtraj=1.10.3

  # Test and developer utilities.
  - pytest
  - pytest-cov

  # Official PyTorch-channel Conda releases stopped before 2.8. Use the
  # conda-forge CPU variant explicitly; this is still a candidate, not a lock.
  # nodefaults above excludes inherited default channels. G00 records and checks
  # the solved channel/build and actual torch backend. GPU profiles are separate.
  - pytorch=2.8.0=cpu*

  - pip:
      # MACE reference implementation. Keep the version fixed.
      - mace-torch==0.3.16
      # 1.3 requires NumPy 2; this release explicitly supports NumPy 1.x.
      - matscipy==1.1.1

      # OpenMM-ML 1.8 is required because the Project 0 design uses its
      # mechanical-embedding/link-site implementation. Install the selected
      # release tag rather than a moving main branch.
      - openmmml @ git+https://github.com/openmm/openmm-ml.git@1.8

      # Project 0 targets the v8.5.0 AToM source tree because its ATMForce
      # integration is the workflow being qualified. Use the tag rather than
      # the moving default branch.
      - atom-openmm @ git+https://github.com/Gallicchio-Lab/AToM-OpenMM.git@v8.5.0
